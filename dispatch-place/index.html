<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>เลือกสถานที่ขนส่ง · AJ</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;margin:0;background:#f7f8fa;color:#172033}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:16px;padding:18px;margin-bottom:12px}h1{font-size:21px;margin:0 0 5px}h2{font-size:17px;margin:0 0 12px}.hint{font-size:13px;color:#667085;line-height:1.5;margin:0 0 14px}.label{font-size:13px;font-weight:800;display:block;margin:0 0 7px}.input{width:100%;border:1px solid #ccd3dc;border-radius:10px;padding:12px;font:inherit;font-size:15px;background:#fff}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.btn{border:1px solid #cdd5df;border-radius:10px;background:#fff;padding:10px 12px;font:inherit;font-size:14px;font-weight:750;color:#253047;cursor:pointer}.btn:disabled{opacity:.45;cursor:default}.primary{background:#c90012;border-color:#c90012;color:#fff}.selected{margin-top:14px;padding:12px;border:1px solid #b3dac0;border-radius:10px;background:#effaf2;font-size:14px;line-height:1.5}.selected b{display:block}.saved{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #e9edf2}.saved:last-child{border-bottom:0}.saved-name{border:0;background:none;text-align:left;padding:0;color:#172033;font:inherit;flex:1}.saved-name b{display:block;font-size:14px}.saved-name small{display:block;color:#667085;margin-top:2px}.remove{border:0;background:#f3f4f6;border-radius:8px;padding:6px 9px;color:#667085;font-size:14px}.error{color:#ad0013;font-size:13px;margin-top:8px}.actions{position:sticky;bottom:0;background:#f7f8fa;padding:10px 0}.actions .btn{width:100%;min-height:48px}
</style></head><body><main class="wrap"><section class="card"><h1 id="title"></h1><p class="hint" id="help"></p><label class="label" id="searchLabel" for="placeInput"></label><input id="placeInput" class="input" autocomplete="off"><div class="row"><button id="current" class="btn" type="button"></button><button id="pin" class="btn" type="button"></button></div><div id="selected" class="selected" hidden></div><p id="error" class="error" hidden></p></section><section class="card"><h2 id="savedTitle"></h2><div id="savedList"></div><div id="savePanel" hidden><label class="label" id="nameLabel" for="placeName"></label><input id="placeName" class="input" maxlength="70"><div class="row"><button id="save" class="btn" type="button"></button></div></div></section><div class="actions"><button id="use" class="btn primary" type="button" disabled></button></div></main>
<script src="../assets/place-search.js?v=20261003-6"></script><script>
(()=>{'use strict';
const T={th:{title:'เลือกสถานที่สำหรับงานขนส่ง',help:'ค้นหาชื่อสถานที่หรือวางลิงก์ Google Maps แล้วเลือกจากรายการ หรือใช้ตำแหน่งปัจจุบันและปักหมุด',search:'สถานที่',placeholder:'พิมพ์ชื่อสถานที่ / ที่อยู่ หรือวางลิงก์ Google Maps',current:'ใช้ตำแหน่งปัจจุบัน',pin:'ปักหมุดบนแผนที่',saved:'สถานที่บันทึกไว้',none:'ยังไม่มีสถานที่ที่บันทึก',name:'ตั้งชื่อสถานที่',namePlaceholder:'เช่น ร้าน AJ หรือ บ้านลูกค้า',save:'บันทึกสถานที่',use:'ใช้สถานที่นี้ในงานขนส่ง',need:'เลือกสถานที่ก่อน',busy:'กำลังหาตำแหน่ง…',outside:'เลือกตำแหน่งในประเทศไทย',remove:'ลบ'},en:{title:'Choose a trip location',help:'Search for a place or paste a Google Maps link. You can also use your current location or pin it on the map.',search:'Location',placeholder:'Place, address or Google Maps link',current:'Use current location',pin:'Pin on map',saved:'Saved places',none:'No saved places yet',name:'Name this place',namePlaceholder:'For example, AJ shop or customer home',save:'Save place',use:'Use this place for the trip',need:'Choose a place first',busy:'Finding your location…',outside:'Choose a location in Thailand',remove:'Remove'}};
const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'th', t=T[lang], $=id=>document.getElementById(id);
let selected=null,saved=[];
function emit(type,payload={}){const message=JSON.stringify({type,...payload});if(window.ReactNativeWebView?.postMessage)window.ReactNativeWebView.postMessage(message);else if(window.parent!==window)window.parent.postMessage({type,...payload},'*')}
function esc(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function valid(place){return place&&Number.isFinite(Number(place.lat))&&Number.isFinite(Number(place.lng))&&Number(place.lat)>=5&&Number(place.lat)<=21&&Number(place.lng)>=97&&Number(place.lng)<=106}
function showError(text){$('error').textContent=text||'';$('error').hidden=!text}
function render(){const text=selected?(selected.name||selected.address||`${Number(selected.lat).toFixed(6)}, ${Number(selected.lng).toFixed(6)}`):'';$('selected').hidden=!selected;$('selected').innerHTML=selected?`<b>${esc(text)}</b>${selected.address&&selected.address!==text?esc(selected.address):''}`:'';$('use').disabled=!selected;$('savePanel').hidden=!selected;$('savedList').innerHTML=saved.length?saved.map((item,i)=>`<div class="saved"><button class="saved-name" data-pick="${i}" type="button"><b>${esc(item.label)}</b><small>${esc(item.place.address||item.place.name||'')}</small></button><button class="remove" data-remove="${i}" type="button" aria-label="${esc(t.remove)}">×</button></div>`).join(''):`<p class="hint">${esc(t.none)}</p>`}
for(const [id,key] of [['title','title'],['help','help'],['searchLabel','search'],['current','current'],['pin','pin'],['savedTitle','saved'],['nameLabel','name'],['save','save'],['use','use']])$(id).textContent=t[key];$('placeInput').placeholder=t.placeholder;$('placeName').placeholder=t.namePlaceholder;
const search=AJPlaceSearch.create({input:'#placeInput',api:'https://aj-line-oa-bot.onrender.com',lang:()=>lang,onInput:()=>{selected=null;render();showError('')},onPlace:place=>{if(!valid(place)){showError(t.outside);return}selected=place;render();showError('')}});
window.dispatchPlaceCurrent=async at=>{if(valid(at))search.usePin(at);else{showError('');const pin=await search.pickOnMap();if(pin)search.usePin(pin)}};
$('current').onclick=async()=>{showError(t.busy);if(window.ReactNativeWebView?.postMessage){emit('AJ_DISPATCH_LOCATE');return}try{const at=await search.locate();if(at)search.usePin(at);else showError('')}catch{showError(t.need)}};
$('pin').onclick=async()=>{const at=await search.pickOnMap();if(at)search.usePin(at)};
$('use').onclick=()=>{if(!valid(selected))return showError(t.need);emit('AJ_DISPATCH_PLACE',{place:selected})};
$('save').onclick=()=>{if(!valid(selected))return showError(t.need);const label=$('placeName').value.trim()||selected.name||selected.address;if(!label)return showError(t.name);const item={label:label.slice(0,70),place:selected};saved=[item,...saved.filter(p=>p.label!==item.label)].slice(0,40);$('placeName').value='';render();emit('AJ_DISPATCH_SAVE',{item})};
$('savedList').onclick=event=>{const pick=event.target.closest('[data-pick]'),remove=event.target.closest('[data-remove]');if(pick){const item=saved[Number(pick.dataset.pick)];if(item){selected=item.place;$('placeInput').value=item.label;search.remember(item.label);render();showError('')}}if(remove){const item=saved[Number(remove.dataset.remove)];if(item){saved=saved.filter(p=>p!==item);render();emit('AJ_DISPATCH_REMOVE',{label:item.label})}}};
function init(data){if(Array.isArray(data.saved))saved=data.saved.filter(item=>item&&item.label&&valid(item.place)).slice(0,40);if(valid(data.current)&&!selected){selected=data.current;$('placeInput').value=selected.name||selected.address||'';search.remember($('placeInput').value)}render()}
window.dispatchPlaceInit=init;window.addEventListener('message',event=>{if(event.data?.type==='AJ_DISPATCH_INIT')init(event.data)});render();emit('AJ_DISPATCH_READY');
})();
</script></body></html>
