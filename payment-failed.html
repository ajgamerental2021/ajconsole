<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment not completed | AJ Game Rental</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#fff2f2}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(100%,560px);background:#fff;border-radius:20px;padding:30px;box-shadow:0 18px 55px rgba(91,28,28,.14)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px}.brand img{width:52px;height:52px;object-fit:contain;border-radius:50%}.badge{display:inline-flex;border-radius:8px;background:#ffe3e3;color:#b42318;padding:7px 11px;font-weight:800;font-size:14px}h1{font-size:clamp(28px,6vw,40px);line-height:1.08;margin:14px 0 12px;color:#111827}p{line-height:1.55;color:#59657d;margin:0 0 22px}.notice{padding:14px;border-radius:10px;background:#fff7d6;color:#755000;font-weight:700;line-height:1.5}.row{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid #e3e7ef}.row span{color:#71809d}.row b{overflow-wrap:anywhere}.actions{display:flex;gap:10px;margin-top:24px}.button{flex:1;border:0;border-radius:10px;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer;text-align:center;text-decoration:none}.primary{background:#c5221f;color:#fff}.secondary{background:#f0f3f8;color:#172033}.language{border:1px solid #cbd4e5;border-radius:999px;background:#fff;padding:7px 10px;font-weight:700}@media(max-width:480px){body{padding:14px}.card{padding:22px}.top{align-items:flex-start}.row{display:block}.row b{display:block;margin-top:4px}.actions{flex-direction:column}}
  </style>
</head>
<body>
  <main class="card">
    <div class="top"><div class="brand"><img src="assets/aj-logo-circle.png" alt="AJ Game Rental"><span>AJ Game Rental</span></div><select class="language" id="language"><option value="en">English</option><option value="th">ไทย</option></select></div>
    <div class="badge" id="badge">● Payment not completed</div>
    <h1 id="title">Payment was not completed</h1>
    <p id="message">No successful payment was confirmed. You can return and try again.</p>
    <div class="row"><span id="rentalCodeLabel">Rental code</span><b id="rentalCode">-</b></div>
    <div class="notice" id="notice">If you believe you were charged, screenshot this page and contact AJ before trying again.</div>
    <div class="actions"><button class="button primary" id="retryButton" type="button">Try payment again</button><a class="button secondary" id="contactButton" href="https://lin.ee/N4i6cb6">Contact AJ</a></div>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const lang = params.get("lang") === "th" ? "th" : "en";
      const copy = {en:{badge:"● Payment not completed",title:"Payment was not completed",message:"No successful payment was confirmed. You can return and try again.",code:"Rental code",notice:"If you believe you were charged, screenshot this page and contact AJ before trying again.",retry:"Try payment again",contact:"Contact AJ"},th:{badge:"● การชำระเงินไม่สำเร็จ",title:"การชำระเงินยังไม่เสร็จสมบูรณ์",message:"ระบบยังไม่พบการชำระเงินสำเร็จ คุณสามารถกลับไปลองใหม่ได้",code:"รหัสการเช่า",notice:"หากพบว่ามีการตัดเงินแล้ว กรุณาแคปหน้าจอนี้และติดต่อ AJ ก่อนลองชำระซ้ำ",retry:"ลองชำระเงินอีกครั้ง",contact:"ติดต่อ AJ"}}[lang];
      const set = (id, value) => { document.getElementById(id).textContent = value; };
      document.documentElement.lang = lang; set("badge",copy.badge);set("title",copy.title);set("message",copy.message);set("rentalCodeLabel",copy.code);set("rentalCode",params.get("rentalCode")||"-");set("notice",copy.notice);set("retryButton",copy.retry);set("contactButton",copy.contact);document.getElementById("language").value=lang;
      document.getElementById("language").addEventListener("change",event=>{params.set("lang",event.target.value);location.search=params.toString()});
      document.getElementById("retryButton").addEventListener("click",()=>{if(history.length>1)history.back();else location.href=`index-demo.html?lang=${lang}`});
    })();
  </script>
</body>
</html>
