<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AJ Multi-device Rental Demo</title>
  <style>
    :root{--red:#d50000;--ink:#182033;--muted:#667085;--line:#dfe3ea;--bg:#f4f6fa;--green:#087a3f;--soft:#fff4f4}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Noto Sans Thai",sans-serif}
    button,input,select{font:inherit}.wrap{max-width:1180px;margin:auto;padding:20px}.top,.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 22px #15213b0d}
    .top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;margin-bottom:16px}.brand{font-weight:900;font-size:22px}.demo{color:#9b1c1c;background:#fff0f0;border:1px solid #ffc7c7;border-radius:999px;padding:5px 10px;font-size:13px}
    .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
    .grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:16px}.card{padding:18px;margin-bottom:16px}h1,h2,h3{margin:0 0 12px}h1{font-size:25px}h2{font-size:20px}h3{font-size:17px}.sub{color:var(--muted);margin:0 0 16px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-weight:750;font-size:14px;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #cfd5df;border-radius:10px;background:#fff}
    .rental-item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.item-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.item-name{font-weight:900}.pill{font-size:13px;padding:4px 9px;border-radius:999px;background:#eef2f8}.status.ok{color:var(--green)}.status.bad{color:#b42318}.status.wait{color:#875b00}
    .qty{display:flex;align-items:center;gap:8px}.qty button{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#fff}.qty strong{min-width:24px;text-align:center}.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
    .game-box{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}.game-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;gap:7px;align-items:flex-start;padding:8px;border:1px solid #edf0f4;border-radius:9px}.check input{margin-top:3px}.same{display:flex;gap:8px;align-items:center;background:#f6f8fb;padding:9px;border-radius:9px;margin-bottom:9px}
    .summary-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #edf0f4}.summary-row.total{font-size:20px;font-weight:900;border:0}.notice{padding:11px 13px;border-radius:11px;background:#eef9f2;color:#126b3b}.warn{background:#fff8e8;color:#835500}.error{background:#fff1f0;color:#a61b13}.empty{text-align:center;color:var(--muted);padding:28px 10px}
    pre{white-space:pre-wrap;word-break:break-word;background:#101828;color:#d1fadf;border-radius:12px;padding:13px;max-height:360px;overflow:auto;font-size:12px}.admin{display:flex;gap:10px;align-items:end}.admin .field{max-width:180px}.footer-actions{display:flex;gap:10px;justify-content:flex-end}.small{font-size:13px;color:var(--muted)}
    @media(max-width:820px){.grid{grid-template-columns:1fr}.fields,.item-grid{grid-template-columns:1fr}.game-list{grid-template-columns:1fr}.wrap{padding:10px}.top{align-items:flex-start;gap:10px}.brand{font-size:18px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="top"><div><div class="brand">AJ Game Rental</div><span class="demo" id="demoBadge">DEMO — ไม่บันทึกข้อมูลจริง</span></div><button class="btn" id="langBtn">English</button></header>
  <div class="grid">
    <main>
      <section class="card">
        <h1 id="pageTitle"></h1><p class="sub" id="pageSub"></p>
        <div class="fields">
          <div class="field"><label id="startLabel" for="start"></label><input id="start" type="date"></div>
          <div class="field"><label id="endLabel" for="end"></label><input id="end" type="date"></div>
          <div class="field"><label id="modelLabel" for="model"></label><select id="model"></select></div>
          <div class="field"><label id="addLabel">&nbsp;</label><button class="btn primary" id="addBtn" style="width:100%"></button></div>
        </div>
        <p class="small" id="limitText"></p>
      </section>
      <section class="card"><h2 id="itemsTitle"></h2><div id="items"></div></section>
      <section class="card">
        <h2 id="adminTitle"></h2>
        <div class="admin"><div class="field"><label id="maxLabel" for="maxDevices"></label><input id="maxDevices" type="number" min="1" max="20" value="5"></div><button class="btn" id="saveSetting"></button></div>
        <p class="small" id="sourceText"></p>
      </section>
    </main>
    <aside>
      <section class="card" style="position:sticky;top:12px">
        <h2 id="summaryTitle"></h2><div id="summary"></div>
        <div class="footer-actions"><button class="btn" id="payloadBtn"></button><button class="btn primary" id="continueBtn"></button></div>
      </section>
      <section class="card"><h3 id="payloadTitle"></h3><pre id="payload"></pre></section>
    </aside>
  </div>
</div>
<script>
(() => {
  'use strict';
  const API = 'https://aj-line-oa-bot.onrender.com/api/availability';
  const consoles = [
    [1,'PS4',300,1500,2000,'ps4'],[2,'PS Portal',300,1500,2000,''],[3,'PS VR2',300,1500,2000,''],
    [4,'Nintendo Switch 1',300,1500,2000,'switch1'],[5,'Xbox Series S',300,1500,2000,'xbox'],[6,'XREAL One',300,1500,2000,''],
    [7,'Meta Quest 3s',300,1500,2000,'meta'],[8,'Logitech G29',300,1500,2000,''],[9,'Xbox Series X',350,1800,2000,'xbox'],
    [10,'Viture Luma Pro',350,1800,2000,''],[11,'PS5',400,2500,2000,'ps5'],[12,'Nintendo Switch 2',400,2500,2000,'switch2'],
    [13,'ROG Xbox Ally X',400,2500,2000,'rog'],[14,'Meta Quest 3',400,2500,2000,'meta'],[15,'Steam Deck OLED',400,2500,2000,'steam'],
    [16,'Viture Luma Ultra',400,2500,2000,''],[17,'Viture Beast',400,2500,2000,''],[18,'PS5 Pro',500,3000,4000,'ps5'],[19,'Lenovo Legion GO2',500,3000,4000,'rog']
  ].map(([id,name,daily,weekly,deposit,platform])=>({id:String(id),name,daily,weekly,deposit,platform}));
  const games = {
    ps4:['EA Sports FC 26','Tekken 7','It Takes Two','Minecraft'], ps5:['EA Sports FC 26','Astro Bot','Tekken 8','Spider-Man 2','Black Myth: Wukong'],
    switch1:['Mario Kart 8 Deluxe','Super Smash Bros. Ultimate','Nintendo Switch Sports'], switch2:['Mario Kart World','Donkey Kong Bananza','Nintendo Switch 2 Welcome Tour'],
    xbox:['Forza Horizon 5','Game Pass catalogue','EA Sports FC 26'], meta:['Beat Saber','Walkabout Mini Golf','Batman: Arkham Shadow'],
    rog:['PC Game Pass','Steam catalogue','EA Sports FC 26'], steam:['Steam catalogue','Hades II','Cyberpunk 2077']
  };
  const copy = {
    th:{title:'ทดลองเช่าหลายเครื่องใน Rental ID เดียว',sub:'เลือกได้หลายรุ่นและหลายเครื่อง สูงสุดตามค่าที่ Admin กำหนด หน้า Demo นี้ไม่สร้างการจองจริง',start:'วันที่เริ่มเช่า',end:'วันที่คืนเครื่อง',model:'เพิ่มรุ่นเครื่อง',add:'เพิ่มเครื่อง',items:'รายการเครื่องเช่า',empty:'ยังไม่มีเครื่องในรายการ',limit:'เลือกแล้ว {n}/{max} เครื่อง',qty:'จำนวน',remove:'ลบ',games:'เกมสำหรับเครื่องนี้',same:'ใช้รายการเกมเดียวกันทุกเครื่องรุ่นนี้',noGames:'เครื่องรุ่นนี้ไม่มีรายการเกมให้เลือก',checking:'กำลังตรวจสอบคิว…',available:'คิวว่าง',unavailable:'จำนวนเครื่องว่างไม่เพียงพอ',queueError:'เชื่อมต่อระบบตรวจคิวไม่ได้ กรุณาลองใหม่',dates:'กรุณาเลือกวันที่',summary:'สรุปค่าเช่า',rental:'ค่าเช่า',deposit:'ค่าประกัน',promo:'After Work 3 Nights',total:'ยอดรวมทั้งหมด',continue:'ดำเนินการต่อ (Demo)',payload:'อัปเดต Payload',payloadTitle:'ตัวอย่าง Contract / Delivery payload',admin:'Demo Admin Settings',max:'จำนวนเครื่องสูงสุดต่อ Rental ID',save:'บันทึกค่า Demo',source:'Single source of truth สำหรับ Demo เท่านั้น ค่า Production ไม่ถูกแก้ไข',over:'เพิ่มไม่ได้ เพราะครบจำนวนสูงสุดแล้ว',needItem:'กรุณาเพิ่มเครื่องอย่างน้อย 1 เครื่อง',notReady:'ยังดำเนินการต่อไม่ได้ กรุณาตรวจวันที่ จำนวน และคิวของทุกเครื่อง',ready:'ข้อมูล Demo ผ่านการตรวจสอบเบื้องต้น'},
    en:{title:'Multi-device rental under one Rental ID',sub:'Choose multiple models and quantities up to the Admin limit. This demo does not create a real booking.',start:'Rental start date',end:'Return date',model:'Add a device model',add:'Add device',items:'Rental items',empty:'No devices added yet',limit:'Selected {n}/{max} devices',qty:'Quantity',remove:'Remove',games:'Games for this item',same:'Use the same game list for every unit of this model',noGames:'This device has no selectable game catalogue',checking:'Checking availability…',available:'Available',unavailable:'Not enough available units',queueError:'Could not connect to availability service. Please try again.',dates:'Select rental dates',summary:'Rental summary',rental:'Rental fee',deposit:'Security deposit',promo:'After Work 3 Nights',total:'Grand total',continue:'Continue (Demo)',payload:'Refresh payload',payloadTitle:'Contract / Delivery payload preview',admin:'Demo Admin Settings',max:'Maximum devices per Rental ID',save:'Save demo setting',source:'Single source of truth for this demo only. Production settings are unchanged.',over:'Cannot add more devices because the maximum has been reached',needItem:'Add at least one device',notReady:'Cannot continue yet. Check dates, quantities and availability for every item.',ready:'Demo data passed preliminary validation'}
  };
  const state={lang:'th',items:[],modelId:'1',max:Number(localStorage.getItem('aj_demo_max_devices')||5),availability:{rows:[],loading:false,error:false},counter:0};
  const $=id=>document.getElementById(id), t=k=>copy[state.lang][k]||k;
  const iso=d=>d.toISOString().slice(0,10), parse=s=>s?new Date(`${s}T00:00:00`):null;
  const days=()=>{const a=parse($('start').value),b=parse($('end').value);return a&&b?Math.round((b-a)/86400000):0};
  const totalQty=()=>state.items.reduce((n,x)=>n+x.quantity,0);
  const money=n=>`฿${Math.round(n).toLocaleString('en-US')}`;
  function quote(item){
    const d=days(); let rental=d>=7?Math.floor(d/7)*item.model.weekly+(d%7)*item.model.daily:d*item.model.daily; let promo=0;
    const start=parse($('start').value); const mondayOrTuesday=start&&[1,2].includes(start.getDay());
    const promoPrices={300:777,350:888,400:999,500:1299};
    if(d===3&&mondayOrTuesday&&promoPrices[item.model.daily]){promo=Math.max(0,rental-promoPrices[item.model.daily]);rental-=promo}
    return {unitRental:rental,unitDeposit:item.model.deposit,rentalSubtotal:rental*item.quantity,depositSubtotal:item.model.deposit*item.quantity,promotionDiscount:promo*item.quantity};
  }
  function selectedGames(item){return Array.isArray(item.games)?item.games:[]}
  function availabilityAliases(model){return new Set([model.name.toLowerCase(),model.name.replace(/\s+/g,'').toLowerCase()])}
  function rowName(row){return String(row.deviceName||row.console||row.device||row.name||'').trim()}
  function rowFree(row){const start=$('start').value,end=$('end').value;const ranges=Array.isArray(row.bookingRanges)?row.bookingRanges:[];return !ranges.some(range=>{const status=String(range.status||'').toLowerCase();if(!['booked','rented','busy','unavailable','maintenance'].some(x=>status.includes(x)))return false;const a=String(range.startDate||''),b=String(range.returnDate||range.endDate||'');return a&&b&&start<b&&end>a})}
  function itemAvailability(item){
    if(!$('start').value||!$('end').value||days()<3)return {ready:false,text:t('dates')};
    if(state.availability.loading)return {ready:false,text:t('checking')}; if(state.availability.error)return {ready:false,text:t('queueError')};
    const aliases=availabilityAliases(item.model);const matching=state.availability.rows.filter(r=>aliases.has(rowName(r).toLowerCase())||aliases.has(rowName(r).replace(/\s+/g,'').toLowerCase()));
    if(!matching.length)return {ready:true,text:t('available')}; const free=matching.filter(rowFree).length;return {ready:free>=item.quantity,text:free>=item.quantity?t('available'):t('unavailable')};
  }
  async function loadAvailability(){
    if(!$('start').value||!$('end').value){render();return} state.availability.loading=true;state.availability.error=false;render();
    try{const res=await fetch(`${API}?startDate=${encodeURIComponent($('start').value)}&endDate=${encodeURIComponent($('end').value)}&_ts=${Date.now()}`,{cache:'no-store'});if(!res.ok)throw Error('availability');const data=await res.json();state.availability.rows=Array.isArray(data)?data:(data.rows||data.items||data.availability||[])}catch(e){state.availability.error=true;state.availability.rows=[]}finally{state.availability.loading=false;render()}
  }
  function addItem(){const model=consoles.find(x=>x.id===state.modelId);if(!model)return;if(totalQty()>=state.max){alert(t('over'));return}const existing=state.items.find(x=>x.model.id===model.id);if(existing)existing.quantity++;else state.items.push({id:`RI-DEMO-${++state.counter}`,model,quantity:1,sameGames:true,games:[]});render()}
  function renderItems(){
    if(!state.items.length){$('items').innerHTML=`<div class="empty">${t('empty')}</div>`;return}
    $('items').innerHTML=state.items.map(item=>{const av=itemAvailability(item),catalog=games[item.model.platform]||[],q=quote(item);return `<article class="rental-item" data-item="${item.id}">
      <div class="item-head"><div><span class="item-name">${item.model.name}</span> <span class="pill">${money(item.model.daily)}/${state.lang==='en'?'day':'วัน'}</span></div><button class="btn" data-remove="${item.id}">${t('remove')}</button></div>
      <div class="item-grid"><div><div class="small">${t('qty')}</div><div class="qty"><button data-minus="${item.id}">−</button><strong>${item.quantity}</strong><button data-plus="${item.id}">+</button></div></div><div class="status ${av.ready?'ok':state.availability.loading?'wait':'bad'}">${av.text}</div></div>
      <div class="small">${t('rental')}: ${money(q.rentalSubtotal)} · ${t('deposit')}: ${money(q.depositSubtotal)}${q.promotionDiscount?` · <span class="status ok">${t('promo')} −${money(q.promotionDiscount)}</span>`:''}</div>
      <div class="game-box"><h3>${t('games')} — ${item.model.name}</h3>${catalog.length?`${item.quantity>1?`<label class="same"><input type="checkbox" data-same="${item.id}" ${item.sameGames?'checked':''}> ${t('same')}</label>`:''}<div class="game-list">${catalog.map(g=>`<label class="check"><input type="checkbox" data-game="${item.id}" value="${g}" ${item.games.includes(g)?'checked':''}> <span>${g}</span></label>`).join('')}</div>`:`<div class="small">${t('noGames')}</div>`}</div>
    </article>`}).join('');
  }
  function buildPayload(){
    const rentalItems=state.items.map(item=>{const q=quote(item);return {rental_item_id:item.id,device_id:item.model.id,device_name:item.model.name,quantity:item.quantity,start_date:$('start').value,return_date:$('end').value,unit_rental_fee:q.unitRental,rental_subtotal:q.rentalSubtotal,unit_deposit:q.unitDeposit,deposit_subtotal:q.depositSubtotal,promotion_discount:q.promotionDiscount,game_platform:item.model.platform||null,use_same_games_for_same_model:item.sameGames,games:selectedGames(item),assigned_assets:[]}});
    return {schema_version:2,demo:true,rental_order_id:'AJ-DEMO-MULTI-DEVICE',rental_items:rentalItems,total_device_quantity:totalQty(),totals:{rental:rentalItems.reduce((n,x)=>n+x.rental_subtotal,0),deposit:rentalItems.reduce((n,x)=>n+x.deposit_subtotal,0),grand_total:rentalItems.reduce((n,x)=>n+x.rental_subtotal+x.deposit_subtotal,0)},warnings:rentalItems.flatMap(x=>x.assigned_assets.length<x.quantity?[`Asset assignment pending: ${x.device_name} ${x.assigned_assets.length}/${x.quantity}`]:[]),revision:1};
  }
  function renderSummary(){const p=buildPayload();$('summary').innerHTML=(p.rental_items.length?p.rental_items.map(x=>`<div class="summary-row"><span>${x.device_name} × ${x.quantity}</span><strong>${money(x.rental_subtotal+x.deposit_subtotal)}</strong></div>`).join(''):`<div class="empty">${t('empty')}</div>`)+`<div class="summary-row"><span>${t('rental')}</span><strong>${money(p.totals.rental)}</strong></div><div class="summary-row"><span>${t('deposit')}</span><strong>${money(p.totals.deposit)}</strong></div><div class="summary-row total"><span>${t('total')}</span><strong>${money(p.totals.grand_total)}</strong></div>`;$('payload').textContent=JSON.stringify(p,null,2);const ready=state.items.length&&totalQty()<=state.max&&days()>=3&&state.items.every(x=>itemAvailability(x).ready);$('continueBtn').disabled=!ready;$('continueBtn').title=ready?t('ready'):t('notReady')}
  function render(){
    document.documentElement.lang=state.lang;const ids={pageTitle:'title',pageSub:'sub',startLabel:'start',endLabel:'end',modelLabel:'model',addBtn:'add',itemsTitle:'items',summaryTitle:'summary',continueBtn:'continue',payloadBtn:'payload',payloadTitle:'payloadTitle',adminTitle:'admin',maxLabel:'max',saveSetting:'save',sourceText:'source'};Object.entries(ids).forEach(([id,key])=>$(id).textContent=t(key));$('langBtn').textContent=state.lang==='th'?'English':'ไทย';$('demoBadge').textContent=state.lang==='th'?'DEMO — ไม่บันทึกข้อมูลจริง':'DEMO — no real booking is created';$('limitText').textContent=t('limit').replace('{n}',totalQty()).replace('{max}',state.max);$('maxDevices').value=state.max;$('model').innerHTML=consoles.map(x=>`<option value="${x.id}" ${x.id===state.modelId?'selected':''}>${x.name} (${money(x.daily)}/${state.lang==='en'?'day':'วัน'})</option>`).join('');renderItems();renderSummary();bindDynamic()
  }
  function bindDynamic(){document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.items=state.items.filter(x=>x.id!==b.dataset.remove);render()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{const x=state.items.find(i=>i.id===b.dataset.minus);if(x&&x.quantity>1)x.quantity--;render()});document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{const x=state.items.find(i=>i.id===b.dataset.plus);if(!x)return;if(totalQty()>=state.max)return alert(t('over'));x.quantity++;render()});document.querySelectorAll('[data-same]').forEach(c=>c.onchange=()=>{const x=state.items.find(i=>i.id===c.dataset.same);if(x)x.sameGames=c.checked;renderSummary()});document.querySelectorAll('[data-game]').forEach(c=>c.onchange=()=>{const x=state.items.find(i=>i.id===c.dataset.game);if(!x)return;x.games=Array.from(document.querySelectorAll(`[data-game="${x.id}"]:checked`)).map(el=>el.value);renderSummary()})}
  $('langBtn').onclick=()=>{state.lang=state.lang==='th'?'en':'th';render()};$('model').onchange=()=>{state.modelId=$('model').value};$('addBtn').onclick=addItem;$('start').onchange=loadAvailability;$('end').onchange=loadAvailability;$('payloadBtn').onclick=renderSummary;$('continueBtn').onclick=()=>alert(t('ready'));$('saveSetting').onclick=()=>{const n=Math.max(1,Math.min(20,Number($('maxDevices').value)||5));if(n<totalQty())return alert(t('over'));state.max=n;localStorage.setItem('aj_demo_max_devices',String(n));render()};
  const now=new Date(),end=new Date(now);end.setDate(end.getDate()+3);$('start').value=iso(now);$('end').value=iso(end);render();loadAvailability();
})();
</script>
</body>
</html>
