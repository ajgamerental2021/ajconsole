  .hint.found { color:#067647; font-weight:700; }

    else { var el = document.createElement('textarea'); el.value = text; document.body.appendChild(el); el.select(); try { document.execCommand('copy'); done(); } catch (e) {} document.body.removeChild(el); }
  }

  $('lang').addEventListener('click', function () { lang = lang === 'th' ? 'en' : 'th'; applyLanguage(); });
  $('device').addEventListener('change', function () { quote = null; picked = []; $('bundle').value = ''; renderAddOns(); render(); scheduleAutoQuote(300); });
  $('bundle').addEventListener('change', function () { quote = null; render(); scheduleAutoQuote(300); });
  $('extras').addEventListener('change', function (e) {
    var id = e.target.getAttribute('data-extra');
    if (id === null) return;
    // One accessory (or none) for a PS5 / PS5 Pro; any number otherwise.
    if (e.target.type === 'radio') picked = id ? [id] : [];
    else picked = e.target.checked ? picked.concat([id]) : picked.filter(function (x) { return x !== id; });
    quote = null;
    renderAddOns();
    render();
    scheduleAutoQuote(300);
  });
  // "Use my current location", and the map: both end as a pin in the place
  // box, which finds the address there; the price follows. Where the browser
  // refuses the location (the Facebook and Instagram apps always do), the map
  // opens by itself.
  $('locate').addEventListener('click', function () {
    var btn = $('locate');
    btn.textContent = t('locating');
    showQuoteError('');
    placeSearch.locate().then(function (at) {
      btn.textContent = t('locate');
      if (at) placeSearch.usePin(at);
    });
  });
  $('pinMap').addEventListener('click', function () {
    showQuoteError('');
    placeSearch.pickOnMap().then(function (at) { if (at) placeSearch.usePin(at); });
  });
  // The delivery discount depends on the length, so a new length re-prices.
  $('days').addEventListener('input', function () { renderChips(); render(); scheduleAutoQuote(800); });
  $('dayChips').addEventListener('click', function (e) { var n = e.target.getAttribute('data-days'); if (n) { $('days').value = n; renderChips(); render(); scheduleAutoQuote(300); } });
  $('quote').addEventListener('click', function () { clearTimeout(autoTimer); getQuote(); });
  $('promo').addEventListener('change', render);
  $('noId').addEventListener('change', render);
  $('copy').addEventListener('click', copyText);
  // In the booking page's pop-up the booking carries on right there: the
  // pop-up closes and step 1 opens with this device (and bundle) chosen. On
  // its own the page opens the booking page in the same tab.
  $('book').addEventListener('click', function (event) {
    track('quick_quote_book_clicked');
    var c = selected();
    if (!EMBED || !c || window.parent === window) return;
    event.preventDefault();
    var b = selectedBundle(c);
    window.parent.postMessage({
      type: 'AJ_QUOTE_BOOK', consoleId: String(c.id), bundleId: b ? b.id : '', mapsUrl: quote ? quotedMapsLink : '',
      // Step 2's place box shows the same green place without looking it up again.
      place: quote && chosenPlace ? { name: chosenPlace.name || '', address: chosenPlace.address || '', lat: chosenPlace.lat, lng: chosenPlace.lng } : null
    }, '*');
  });
  $('sendLine').addEventListener('click', function () { saveForLine(); track('quick_quote_line_clicked'); });

  applyLanguage();
  track('quick_quote_opened');
  fetch(CATALOGUE + '?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      consoles = (Array.isArray(data.consoles) ? data.consoles : [])
        .filter(function (c) { return c && (c.name || c.nameEn); })
        .map(function (c) {
          // The booking site's defaults (normalizeConsole / ratePack).
          var rate = Number(c.rate) || 300;
          var pack = rate >= 500 ? { weekly: 3000, deposit: 4000 } : rate >= 400 ? { weekly: 2500, deposit: 2000 } : rate >= 350 ? { weekly: 1800, deposit: 2000 } : { weekly: 1500, deposit: 2000 };
          return { id: c.id, name: String(c.name || c.nameEn).trim(), nameEn: String(c.nameEn || c.name).trim(), brand: c.brand, type: String(c.type || 'console'), readyDate: String(c.readyDate || c.unavailableUntil || '').trim(), rate: rate, weekly: Number(c.weekly) || pack.weekly, deposit: Number(c.deposit) || pack.deposit };
        });
      if (Array.isArray(data.rentalAccessories)) accessories = data.rentalAccessories.map(function (x) { return Object.assign({}, x, { consoleIds: Array.isArray(x.consoleIds) ? x.consoleIds.map(String) : [] }); });
      if (Array.isArray(data.rentalBundles)) bundles = data.rentalBundles.map(function (b) {
        return { id: String(b.id || ''), th: String(b.th || b.titleTh || 'Bundle'), en: String(b.en || b.titleEn || b.th || 'Bundle'), rate: Number(b.rate) || 0, weekly: Number(b.weekly) || 0, deposit: Number(b.deposit) || 0, readyDate: String(b.readyDate || b.unavailableUntil || '') };
      }).filter(function (b) { return b.id && b.rate > 0; });
      fillDevices();
      renderAddOns();
      chooseDevice(wantedDevice);
    })
    .catch(function () { $('device').innerHTML = '<option value="">' + t('catalogueFail') + '</option>'; });
  // The shop's queue closures, from the same place the booking page reads them.
  fetch(API + '/api/queue-closures?_ts=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (payload) {
      var rules = payload && payload.rules && typeof payload.rules === 'object' ? payload.rules : {};
      var lower = function (map) { var out = {}; Object.keys(map || {}).forEach(function (k) { out[String(k).toLowerCase()] = map[k]; }); return out; };
      closures = {
        all: rules.all || { closed: payload.allClosed === true },
        types: lower(rules.types || Object.keys(payload.types || {}).reduce(function (o, k) { o[k] = { closed: payload.types[k] === true }; return o; }, {})),
        devices: lower(rules.devices || Object.keys(payload.devices || {}).reduce(function (o, k) { o[k] = { closed: payload.devices[k] === true }; return o; }, {}))
      };
      fillDevices();
      renderAddOns();
      render();
    })
    .catch(function () {});
})();
</script>
</body>
</html>
